<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Banque d'Heures" />
  <title>Banque d'Heures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0d0d1a;
      --bg2: #111122;
      --bg3: #161628;
      --border: #1e1e3a;
      --border2: #2a2a4a;
      --green: #00c896;
      --green-dark: #00a87a;
      --red: #ff6b6b;
      --yellow: #f0c040;
      --text: #f0f0f0;
      --muted: #888;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: calc(20px + var(--safe-top)) 20px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .header-hours {
      font-family: 'Space Mono', monospace;
      font-size: 52px;
      font-weight: 700;
      color: var(--green);
      line-height: 1;
    }
    .header-unit {
      font-size: 24px;
      color: var(--green-dark);
      margin-left: 2px;
    }
    .week-badge {
      background: var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
      border: 1px solid var(--border2);
    }
    .week-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .week-hours {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--yellow);
    }

    /* NAV */
    .nav {
      display: flex;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      padding: 14px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    /* FEEDBACK */
    .feedback {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      animation: fadeSlide 0.2s ease;
      flex-shrink: 0;
    }
    .feedback.success { background: var(--green); color: var(--bg); }
    .feedback.error { background: var(--red); color: #fff; }

    /* CONTENT */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: calc(16px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    /* CARDS */
    .card {
      background: var(--bg3);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ddd;
    }
    .card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* INPUTS */
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 16px;
      font-family: 'Sora', sans-serif;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    input + input { margin-top: 8px; }
    input:focus { outline: none; border-color: var(--green); }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }

    /* BUTTONS */
    .btn-primary {
      margin-top: 12px;
      width: 100%;
      background: var(--green);
      border: none;
      border-radius: 10px;
      padding: 13px;
      color: var(--bg);
      font-size: 14px;
      font-weight: 700;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-appearance: none;
    }
    .btn-primary:active { opacity: 0.85; transform: scale(0.98); }

    .btn-secondary {
      margin-top: 12px;
      width: 100%;
      background: transparent;
      border: 2px solid var(--red);
      border-radius: 10px;
      padding: 12px;
      color: var(--red);
      font-size: 14px;
      font-weight: 700;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-appearance: none;
    }
    .btn-secondary:active { opacity: 0.85; transform: scale(0.98); }

    /* HISTORIQUE */
    .entree {
      background: var(--bg3);
      border-radius: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      animation: fadeSlide 0.2s ease;
    }
    .entree-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entree-date {
      font-size: 13px;
      color: #aaa;
      font-family: 'Space Mono', monospace;
    }
    .entree-h {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
    }
    .entree-note {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    .empty {
      text-align: center;
      color: #555;
      margin-top: 60px;
      font-size: 14px;
    }

    /* INSTALL BANNER */
    .install-banner {
      background: #1a1a3a;
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #bbb;
      line-height: 1.4;
    }
    .install-icon { font-size: 24px; flex-shrink: 0; }
    .install-banner b { color: var(--text); }
    .install-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 0 0 8px;
      flex-shrink: 0;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-label">BANQUE D'HEURES</div>
      <div class="header-hours" id="solde">0.0<span class="header-unit">h</span></div>
    </div>
    <div class="week-badge">
      <div class="week-label">Cette semaine</div>
      <div class="week-hours" id="semaine">0.0h</div>
    </div>
  </div>

  <!-- Nav -->
  <div class="nav">
    <button class="nav-btn active" id="btn-saisie" onclick="switchView('saisie')">Saisie</button>
    <button class="nav-btn" id="btn-historique" onclick="switchView('historique')">Historique</button>
  </div>

  <!-- Feedback -->
  <div class="feedback success" id="feedback" style="display:none"></div>

  <!-- Vue Saisie -->
  <div class="content" id="view-saisie">
    <div class="install-banner" id="install-banner">
      <span class="install-icon">📲</span>
      <div>
        <b>Installer l'app</b><br>
        Chrome → menu ⋮ → <b>"Ajouter à l'écran d'accueil"</b>
      </div>
      <button class="install-close" onclick="closeInstall()">✕</button>
    </div>

    <div class="card">
      <div class="card-title">📥 Ajouter des heures travaillées</div>
      <input type="number" step="0.5" min="0" placeholder="Ex: 9.5" id="input-heures" inputmode="decimal" />
      <input type="text" placeholder="Note (optionnel)" id="input-note" />
      <button class="btn-primary" onclick="ajouterHeures()">Ajouter</button>
    </div>

    <div class="card">
      <div class="card-title">💸 Enregistrer un paiement</div>
      <div class="card-sub">Combien d'heures t'ont été payées?</div>
      <input type="number" step="0.5" min="0" value="40" id="input-paiement" inputmode="decimal" />
      <button class="btn-secondary" onclick="enregistrerPaiement()">Déduire du solde</button>
    </div>
  </div>

  <!-- Vue Historique -->
  <div class="content" id="view-historique" style="display:none">
    <div id="liste-historique"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'heures-banque-v1';

  // Load data
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { solde: 0, entrees: [] };
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {
      showFeedback('Erreur de sauvegarde', 'error');
    }
  }

  let data = loadData();

  // Render
  function render() {
    document.getElementById('solde').innerHTML = data.solde.toFixed(1) + '<span class="header-unit">h</span>';
    document.getElementById('semaine').textContent = totalSemaine().toFixed(1) + 'h';
    renderHistorique();
  }

  function totalSemaine() {
    const now = new Date();
    const startOfWeek = new Date(now);
    const day = now.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    startOfWeek.setDate(now.getDate() + diff);
    startOfWeek.setHours(0, 0, 0, 0);
    return data.entrees
      .filter(e => e.type === 'ajout' && new Date(e.date) >= startOfWeek)
      .reduce((acc, e) => acc + e.heures, 0);
  }

  function renderHistorique() {
    const el = document.getElementById('liste-historique');
    if (data.entrees.length === 0) {
      el.innerHTML = '<div class="empty">Aucune entrée pour l\'instant.</div>';
      return;
    }
    el.innerHTML = data.entrees.map(e => `
      <div class="entree" style="border-left: 4px solid ${e.type === 'paiement' ? '#ff6b6b' : '#00c896'}; margin-bottom: 10px;">
        <div class="entree-top">
          <span class="entree-date">${e.date}</span>
          <span class="entree-h" style="color:${e.type === 'paiement' ? '#ff6b6b' : '#00c896'}">
            ${e.type === 'paiement' ? '−' : '+'}${e.heures}h
          </span>
        </div>
        ${e.note ? `<div class="entree-note">${e.note}</div>` : ''}
      </div>
    `).join('');
  }

  // Actions
  function ajouterHeures() {
    const raw = document.getElementById('input-heures').value.replace(',', '.');
    const h = parseFloat(raw);
    if (isNaN(h) || h <= 0) { showFeedback('Entre un nombre d\'heures valide.', 'error'); return; }
    const note = document.getElementById('input-note').value.trim();
    const today = new Date().toLocaleDateString('fr-CA');
    data.entrees.unshift({ id: Date.now(), date: today, heures: h, note: note || null, type: 'ajout' });
    data.solde = Math.round((data.solde + h) * 100) / 100;
    saveData(data);
    document.getElementById('input-heures').value = '';
    document.getElementById('input-note').value = '';
    render();
    showFeedback(`+${h}h ajoutées ✓`, 'success');
  }

  function enregistrerPaiement() {
    const raw = document.getElementById('input-paiement').value.replace(',', '.');
    const h = parseFloat(raw);
    if (isNaN(h) || h <= 0) { showFeedback('Nombre d\'heures invalide.', 'error'); return; }
    if (h > data.solde) { showFeedback('Pas assez d\'heures en banque.', 'error'); return; }
    const today = new Date().toLocaleDateString('fr-CA');
    data.entrees.unshift({ id: Date.now(), date: today, heures: h, note: `Paiement de ${h}h`, type: 'paiement' });
    data.solde = Math.round((data.solde - h) * 100) / 100;
    saveData(data);
    render();
    showFeedback(`−${h}h déduites ✓`, 'success');
  }

  // UI helpers
  function switchView(v) {
    document.getElementById('view-saisie').style.display = v === 'saisie' ? 'flex' : 'none';
    document.getElementById('view-historique').style.display = v === 'historique' ? 'flex' : 'none';
    document.getElementById('btn-saisie').className = 'nav-btn' + (v === 'saisie' ? ' active' : '');
    document.getElementById('btn-historique').className = 'nav-btn' + (v === 'historique' ? ' active' : '');
  }

  let feedbackTimer;
  function showFeedback(msg, type) {
    const el = document.getElementById('feedback');
    el.textContent = msg;
    el.className = 'feedback ' + type;
    el.style.display = 'block';
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
  }

  function closeInstall() {
    document.getElementById('install-banner').style.display = 'none';
    localStorage.setItem('install-banner-closed', '1');
  }

  // Hide install banner if already closed
  if (localStorage.getItem('install-banner-closed')) {
    document.getElementById('install-banner').style.display = 'none';
  }

  // Handle enter key on inputs
  document.getElementById('input-note').addEventListener('keydown', e => {
    if (e.key === 'Enter') ajouterHeures();
  });

  render();
</script>
</body>
</html>
